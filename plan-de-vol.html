<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<meta name="description" content="Eurosatory 2026 · Plan de vol pour le salon mondial de la défense terrestre et aéroterrestre, préparée par une visiteuse passionnée de produit & défense.">
<title>Eurosatory 2026 — Plan de vol / Flight Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Saira:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060A12;
  --panel:#0B1322;
  --panel-2:#0E1830;
  --line:#1B2A45;
  --cyan:#4FD8EB;
  --cyan-dim:rgba(79,216,235,.16);
  --amber:#FFB454;
  --text:#D9E4F1;
  --muted:#7E8DA6;
  --radius:10px;
  font-size:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  color:var(--text);
  font-family:'Saira',system-ui,sans-serif;
  font-weight:300;
  line-height:1.55;
  min-height:100vh;
  position:relative;
  overflow-x:hidden;
  background:var(--void);
}
/* ---------- universe background ---------- */
.cosmos{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(79,216,235,.08), transparent 60%),
    var(--void);
}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 20px 64px}
.nebula-1{position:absolute;width:560px;height:420px;top:24%;right:-12%;
  background:radial-gradient(ellipse at center, rgba(124,92,210,.14), rgba(124,92,210,.05) 45%, transparent 70%);}
.nebula-2{position:absolute;width:480px;height:380px;bottom:-6%;left:-10%;
  background:radial-gradient(ellipse at center, rgba(79,216,235,.10), transparent 70%);}
.stars,.stars2{position:absolute;inset:0}
.stars{background-image:
  radial-gradient(1.5px 1.5px at 12% 28%, rgba(217,228,241,.8) 0, transparent 100%),
  radial-gradient(1px 1px at 78% 12%, rgba(217,228,241,.6) 0, transparent 100%),
  radial-gradient(2px 2px at 64% 64%, rgba(217,228,241,.6) 0, transparent 100%),
  radial-gradient(1px 1px at 32% 80%, rgba(217,228,241,.5) 0, transparent 100%),
  radial-gradient(1.5px 1.5px at 90% 45%, rgba(217,228,241,.65) 0, transparent 100%),
  radial-gradient(1px 1px at 6% 60%, rgba(217,228,241,.55) 0, transparent 100%),
  radial-gradient(2px 2px at 45% 10%, rgba(217,228,241,.5) 0, transparent 100%),
  radial-gradient(1px 1px at 55% 92%, rgba(217,228,241,.6) 0, transparent 100%),
  radial-gradient(1px 1px at 22% 45%, rgba(217,228,241,.4) 0, transparent 100%),
  radial-gradient(1.5px 1.5px at 85% 78%, rgba(217,228,241,.55) 0, transparent 100%),
  radial-gradient(1px 1px at 40% 38%, rgba(217,228,241,.45) 0, transparent 100%),
  radial-gradient(1px 1px at 70% 30%, rgba(217,228,241,.5) 0, transparent 100%),
  radial-gradient(1px 1px at 18% 8%, rgba(217,228,241,.5) 0, transparent 100%),
  radial-gradient(1px 1px at 60% 50%, rgba(217,228,241,.35) 0, transparent 100%);
}
.stars2{background-image:
  radial-gradient(1.5px 1.5px at 38% 22%, rgba(79,216,235,.8) 0, transparent 100%),
  radial-gradient(1px 1px at 70% 55%, rgba(79,216,235,.6) 0, transparent 100%),
  radial-gradient(1.5px 1.5px at 15% 88%, rgba(255,180,84,.7) 0, transparent 100%),
  radial-gradient(1px 1px at 95% 25%, rgba(255,180,84,.55) 0, transparent 100%),
  radial-gradient(1px 1px at 50% 75%, rgba(79,216,235,.5) 0, transparent 100%),
  radial-gradient(1.5px 1.5px at 8% 35%, rgba(255,180,84,.5) 0, transparent 100%);
}
@media (prefers-reduced-motion: no-preference){
  .stars2{animation:twinkle 5s ease-in-out infinite alternate}
  @keyframes twinkle{from{opacity:.35}to{opacity:1}}
}
.planet{position:absolute;border-radius:50%}
.planet-1{
  width:380px;height:380px;top:-150px;right:-110px;opacity:.85;
  background:radial-gradient(circle at 32% 32%, #1E3252 0%, #122039 45%, #080F1E 78%);
  box-shadow:inset -40px -25px 70px rgba(0,0,0,.65), 0 0 110px rgba(79,216,235,.08);
}
.planet-1::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:linear-gradient(115deg, transparent 38%, rgba(79,216,235,.07) 42%, transparent 50%, rgba(79,216,235,.05) 58%, transparent 64%);}
.planet-2{
  width:80px;height:80px;top:40%;left:-26px;opacity:.7;
  background:radial-gradient(circle at 30% 30%, #38507A 0%, #16243F 60%, #0A1224 100%);
  box-shadow:0 0 40px rgba(79,216,235,.06);
}
.planet-3{
  width:110px;height:110px;bottom:11%;right:5%;opacity:.8;
  background:radial-gradient(circle at 35% 30%, #4C4066 0%, #241F3D 60%, #0E0C20 100%);
  box-shadow:0 0 50px rgba(124,92,210,.10);
}
.ring{position:absolute;bottom:calc(11% + 36px);right:calc(5% - 42px);width:194px;height:44px;
  border:1.5px solid rgba(150,160,190,.45);border-radius:50%;
  transform:rotate(-18deg);pointer-events:none;
}
.shooting{position:absolute;top:14%;left:18%;width:120px;height:1.5px;opacity:0;
  background:linear-gradient(90deg, rgba(217,228,241,.9), transparent);transform:rotate(-28deg);}
@media (prefers-reduced-motion: no-preference){
  .shooting{animation:shoot 11s ease-in 4s infinite}
  @keyframes shoot{0%{opacity:0;transform:rotate(-28deg) translateX(0)}2%{opacity:.9}6%{opacity:0;transform:rotate(-28deg) translateX(240px)}100%{opacity:0}}
}

/* ---------- header ---------- */
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.eyebrow{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.22em;
  color:var(--cyan);text-transform:uppercase;display:flex;align-items:center;gap:10px;
}
.eyebrow::before{content:"";display:inline-block;width:34px;height:1px;background:var(--cyan)}
.lang{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(11,19,34,.8)}
.lang button{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.1em;
  background:transparent;color:var(--muted);border:none;padding:6px 12px;cursor:pointer;
  transition:background .2s,color .2s;
}
.lang button:hover{color:var(--text)}
.lang button.on{background:var(--cyan-dim);color:var(--cyan)}
.lang button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}
h1{
  font-family:'Chakra Petch',sans-serif;font-weight:700;
  font-size:clamp(1.9rem,5vw,3.1rem);letter-spacing:.04em;line-height:1.08;
  margin:14px 0 8px;text-transform:uppercase;
}
h1 .thin{color:var(--muted);font-weight:500}
.sub{color:var(--muted);max-width:660px;font-size:.97rem}
.sub b{color:var(--text);font-weight:500}

/* ---------- day tabs ---------- */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:34px 0 0}
.day{
  background:rgba(11,19,34,.85);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px 12px 10px;cursor:pointer;text-align:left;color:var(--text);
  font-family:inherit;transition:border-color .2s, background .2s, transform .15s;
  position:relative;overflow:hidden;
}
.day:hover{border-color:var(--cyan);transform:translateY(-2px)}
.day:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.day .d-num{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--muted);letter-spacing:.18em}
.day .d-date{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1.02rem;margin:2px 0}
.day .d-theme{font-size:.74rem;color:var(--muted);line-height:1.3}
.day.active{background:var(--panel-2);border-color:var(--cyan)}
.day.active::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
}
.day.active .d-num{color:var(--cyan)}

/* ---------- day banner ---------- */
.banner{
  margin-top:14px;background:linear-gradient(90deg,var(--cyan-dim),rgba(11,19,34,.6) 70%);
  border:1px solid var(--line);border-left:3px solid var(--cyan);
  border-radius:var(--radius);padding:16px 18px;
}
.banner h2{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase}
.banner p{color:var(--muted);font-size:.93rem;margin-top:4px;max-width:760px}

/* ---------- section titles ---------- */
.sec-title{
  font-family:'IBM Plex Mono',monospace;font-size:.72rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--cyan);margin:38px 0 14px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.sec-title::after{content:"";flex:1;height:1px;background:var(--line);min-width:40px}
.sec-title.tight{margin-top:24px}
.sec-note{font-size:.8rem;color:var(--muted);margin:-8px 0 14px;font-style:italic}

/* ---------- view toggle ---------- */
.view-toggle{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:rgba(11,19,34,.8)}
.view-toggle button{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;
  background:transparent;color:var(--muted);border:none;padding:6px 12px;cursor:pointer;
  transition:background .2s,color .2s;
}
.view-toggle button:hover{color:var(--text)}
.view-toggle button.on{background:var(--cyan-dim);color:var(--cyan)}
.view-toggle button:focus-visible{outline:2px solid var(--cyan);outline-offset:-2px}

/* ---------- conferences ---------- */
.conf-list{display:flex;flex-direction:column;gap:10px}
.conf{
  display:grid;grid-template-columns:118px 1fr;gap:14px;
  background:rgba(11,19,34,.85);border:1px solid var(--line);border-radius:var(--radius);
  padding:14px 44px 14px 16px;transition:border-color .2s;position:relative;
}
.conf:hover{border-color:var(--cyan)}
.conf.faved{border-color:rgba(255,180,84,.5)}
.conf .when{border-right:1px solid var(--line);padding-right:12px;align-self:start;display:flex;flex-direction:column;gap:3px}
.conf time{font-family:'IBM Plex Mono',monospace;font-size:.8rem;color:var(--amber)}
.conf .dlabel{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--cyan);letter-spacing:.1em}
.conf .room{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.conf h4{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1rem;letter-spacing:.02em}
.conf .spk{font-family:'IBM Plex Mono',monospace;font-size:.74rem;color:var(--cyan);margin-top:2px}
.conf .spk::before{content:"▸ ";color:var(--muted)}
.conf p{color:var(--muted);font-size:.88rem;margin-top:4px}
.tag{
  display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;margin-top:8px;
}
.fav{
  position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:6px;
  background:transparent;border:1px solid var(--line);color:var(--muted);
  font-size:1rem;line-height:1;cursor:pointer;transition:color .2s,border-color .2s,background .2s;
}
.fav:hover{border-color:var(--amber);color:var(--amber)}
.fav.on{color:var(--amber);border-color:var(--amber);background:rgba(255,180,84,.1)}
.fav:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.mine-empty{
  color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px;
  padding:24px;text-align:center;
}
.mine-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.copy-btn{
  font-family:'IBM Plex Mono',monospace;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;
  background:rgba(11,19,34,.85);border:1px solid var(--line);color:var(--cyan);border-radius:6px;
  padding:8px 14px;cursor:pointer;transition:border-color .2s;
}
.copy-btn:hover{border-color:var(--cyan)}
.mine-note{font-size:.74rem;color:var(--muted);font-style:italic}

/* ---------- map grid ---------- */
.map-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:stretch}
.map-card,.zone-card{
  background:rgba(11,19,34,.85);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;
}
.map-card{position:relative}
.map-note{font-family:'IBM Plex Mono',monospace;font-size:.66rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
svg{width:100%;height:auto;display:block}
.hall{
  fill:var(--panel-2);stroke:var(--line);stroke-width:1.5;cursor:pointer;
  transition:fill .2s, stroke .2s;
}
g.zone:hover .hall{fill:#13223E;stroke:var(--cyan)}
.hall.sel{fill:var(--cyan-dim);stroke:var(--cyan);stroke-width:2}
.hall-label{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:15px;fill:var(--text);
  pointer-events:none;text-transform:uppercase;letter-spacing:.05em;
}
.hall-label.sm{font-size:11px}
.hall-sub{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--muted);pointer-events:none;letter-spacing:.08em}
g.poi{cursor:pointer}
.pmark{fill:#0E1830;stroke:#2A3A58;stroke-width:1;transition:stroke .2s,fill .2s}
g.poi:hover .pmark{stroke:var(--cyan)}
.pmark.sel{stroke:var(--cyan);fill:var(--cyan-dim)}
.ptext{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:var(--muted);pointer-events:none}
.amen{fill:#0E1830;stroke:var(--amber);stroke-width:1;transition:stroke-width .2s,fill .2s}
g.poi:hover .amen{stroke-width:2}
.amen.sel{fill:rgba(255,180,84,.18);stroke-width:2}
.amen-t{font-family:'IBM Plex Mono',monospace;font-size:8px;fill:var(--amber);pointer-events:none}
.road{stroke:#15233C;stroke-width:8;fill:none;opacity:.8}
.road-t{font-family:'IBM Plex Mono',monospace;font-size:9px;fill:#33476B;letter-spacing:.2em}
.rer-line{stroke:#2A3A58;stroke-width:2.5;stroke-dasharray:7 5;fill:none}
.reticle{stroke:var(--amber);stroke-width:1.4;fill:none;pointer-events:none;opacity:0;transition:opacity .25s}
.reticle.on{opacity:1}
.sweep{transform-origin:450px 270px;opacity:.45}
@media (prefers-reduced-motion: no-preference){
  .sweep{animation:spin 10s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- zone detail ---------- */
.zone-card{display:flex;flex-direction:column;gap:10px;min-height:330px}
.zone-card .z-id{font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--amber);letter-spacing:.2em;text-transform:uppercase}
.zone-card h3{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:1.25rem;text-transform:uppercase;letter-spacing:.03em}
.zone-card p{color:var(--muted);font-size:.92rem}
.z-list{list-style:none;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.z-list li{border-bottom:1px dashed var(--line);padding-bottom:7px;font-size:.92rem;font-weight:400}
.z-empty{color:var(--muted);font-size:.9rem;border:1px dashed var(--line);border-radius:8px;padding:18px;text-align:center;margin:auto 0}

/* ---------- practical ---------- */
.prac{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.p-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;background:rgba(11,19,34,.85);
  transition:border-color .2s;
}
.p-card:hover{border-color:var(--cyan)}
.p-card .p-ico{
  font-family:'IBM Plex Mono',monospace;font-size:.68rem;color:var(--amber);letter-spacing:.18em;
  text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.p-card .p-ico::before{content:"";width:7px;height:7px;background:var(--amber);box-shadow:0 0 8px var(--amber);transform:rotate(45deg);flex:0 0 auto}
.p-card .p-body{color:var(--muted);font-size:.86rem}
.p-card .p-body b{color:var(--text);font-weight:500}

/* ---------- targets ---------- */
.targets{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.t-card{
  border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;background:rgba(11,19,34,.85);
  display:flex;flex-direction:column;gap:2px;transition:border-color .2s;
}
.t-card:hover{border-color:var(--amber)}
.t-card .t-name{
  font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:.95rem;letter-spacing:.02em;
  display:flex;align-items:center;gap:8px;
}
.t-card .t-name::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber);flex:0 0 auto}
.t-card .t-desc{color:var(--muted);font-size:.82rem;padding-left:15px}

/* ---------- footer ---------- */
footer{
  margin-top:48px;border-top:1px solid var(--line);padding-top:16px;
  font-size:.78rem;color:var(--muted);font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;
  display:flex;flex-wrap:wrap;gap:6px 24px;
}

@media (max-width:760px){
  .days{grid-template-columns:repeat(2,1fr)}
  .days .day:last-child{grid-column:span 2}
  .map-grid{grid-template-columns:1fr}
  .conf{grid-template-columns:1fr}
  .conf .when{border-right:none;border-bottom:1px solid var(--line);padding:0 0 8px;flex-direction:row;gap:12px;align-items:baseline;flex-wrap:wrap}
  .planet-1{width:240px;height:240px;top:-110px;right:-90px}
}
</style>
</head>
<body>
<div class="cosmos">
  <div class="nebula-1"></div>
  <div class="nebula-2"></div>
  <div class="stars"></div>
  <div class="stars2"></div>
  <div class="planet planet-1"></div>
  <div class="planet planet-2"></div>
  <div class="planet planet-3"></div>
  <div class="ring"></div>
  <div class="shooting"></div>
</div>

<div class="wrap">

  <header>
    <div class="head-row">
      <div class="eyebrow" id="hEyebrow"></div>
      <div class="lang" role="group" aria-label="Language">
        <button id="btnFr" class="on">FR</button>
        <button id="btnEn">EN</button>
      </div>
    </div>
    <h1><span id="hTitle"></span> <span class="thin" id="hThin"></span></h1>
    <p class="sub" id="hSub"></p>
  </header>

  <nav class="days" id="dayTabs" aria-label="Days"></nav>

  <div class="banner" id="dayBanner">
    <h2 id="bTitle"></h2>
    <p id="bDesc"></p>
  </div>

  <div class="sec-title tight"><span id="secConf"></span><div class="view-toggle" role="group">
    <button id="viewDay"></button><button id="viewMine"></button>
  </div></div>
  <p class="sec-note" id="confNote"></p>
  <div class="conf-list" id="confList"></div>

  <div class="sec-title" id="secMap"></div>
  <div class="map-grid">
    <div class="map-card">
      <div class="map-note" id="mapNote"></div>
      <svg viewBox="0 0 880 580" role="img" aria-label="Site map">
        <defs>
          <radialGradient id="sweepGrad" cx="0" cy="0" r="1">
            <stop offset="0%" stop-color="rgba(79,216,235,.22)"/>
            <stop offset="100%" stop-color="rgba(79,216,235,0)"/>
          </radialGradient>
        </defs>

        <!-- roads -->
        <path class="road" d="M 830 20 C 845 180 850 360 805 560"/>
        <text class="road-t" x="836" y="300" transform="rotate(86 836 300)">A104</text>
        <path class="road" d="M 20 320 C 60 420 120 510 240 565"/>
        <text class="road-t" x="42" y="420" transform="rotate(58 42 420)">D40</text>

        <!-- radar rings -->
        <g stroke="#13203A" fill="none">
          <circle cx="450" cy="270" r="110"/>
          <circle cx="450" cy="270" r="220"/>
          <circle cx="450" cy="270" r="330"/>
        </g>
        <g class="sweep"><path d="M450 270 L450 -60 A330 330 0 0 1 736 105 Z" fill="url(#sweepGrad)"/></g>

        <!-- RER -->
        <path class="rer-line" d="M 50 540 L 830 512"/>
        <g class="poi" id="mRER" data-cx="430" data-cy="526">
          <circle class="pmark" cx="430" cy="526" r="13"/>
          <text class="ptext" x="430" y="529" text-anchor="middle">RER</text>
          <text class="ptext" x="430" y="551" text-anchor="middle">RER B · PARC DES EXPOSITIONS</text>
        </g>

        <!-- zones -->
        <g class="zone" id="zDemo" data-cx="195" data-cy="60">
          <rect class="hall" x="125" y="22" width="140" height="76" rx="6" transform="rotate(-7 195 60)"/>
          <text class="hall-label sm" x="195" y="58" text-anchor="middle" transform="rotate(-7 195 60)" id="lblDemo"></text>
          <text class="hall-sub" x="195" y="74" text-anchor="middle" transform="rotate(-7 195 60)" id="subDemo"></text>
        </g>
        <g class="zone" id="zHall5B" data-cx="460" data-cy="95">
          <rect class="hall" x="295" y="60" width="330" height="70" rx="6" transform="rotate(-4 460 95)"/>
          <text class="hall-label" x="460" y="92" text-anchor="middle" transform="rotate(-4 460 95)">Hall 5B</text>
          <text class="hall-sub" x="460" y="110" text-anchor="middle" transform="rotate(-4 460 95)" id="sub5B"></text>

let lang="fr", dayIdx=0, zoneId=null, selShape=null, viewMode="day";
const myConfs=new Set();

const tabs=document.getElementById("dayTabs");
const reticle=document.getElementById("reticle");

function renderHeader(){
  const t=I18N[lang];
  document.documentElement.lang=lang;
  document.getElementById("hEyebrow").textContent=t.eyebrow;
  document.getElementById("hTitle").textContent=t.title;
  document.getElementById("hThin").textContent=t.thin;
  document.getElementById("hSub").innerHTML=t.sub;
  document.getElementById("secConf").textContent=t.secConf;
  document.getElementById("confNote").textContent=t.confNote;
  document.getElementById("secMap").textContent=t.secMap;
  document.getElementById("secPrac").textContent=t.secPrac;
  document.getElementById("secTargets").textContent=t.secTargets;
  document.getElementById("mapNote").textContent=t.mapNote;
  document.getElementById("mapLegend").textContent=t.mapLegend;
  Object.entries(t.subs).forEach(([id,v])=>{document.getElementById(id).textContent=v;});
  document.getElementById("pageFooter").innerHTML=t.footer.map(f=>`<span>${f}</span>`).join("");
  document.getElementById("btnFr").classList.toggle("on",lang==="fr");
  document.getElementById("btnEn").classList.toggle("on",lang==="en");
  renderViewButtons();
}

function renderViewButtons(){
  const t=I18N[lang];
  const vd=document.getElementById("viewDay"), vm=document.getElementById("viewMine");
  vd.textContent=t.viewDay;
  vm.textContent=t.viewMine+(myConfs.size?` (${myConfs.size})`:"");
  vd.classList.toggle("on",viewMode==="day");
  vm.classList.toggle("on",viewMode==="mine");
}

function renderTabs(){
  const t=I18N[lang];
  tabs.innerHTML="";
  t.days.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="day"+(i===dayIdx?" active":"");
    b.innerHTML=`<div class="d-num">${d.num}</div><div class="d-date">${d.date}</div><div class="d-theme">${d.short}</div>`;
    b.addEventListener("click",()=>{dayIdx=i;viewMode="day";renderTabs();renderBanner();renderConfs();renderViewButtons();});
    tabs.appendChild(b);
  });
}

function renderBanner(){
  const d=I18N[lang].days[dayIdx];
  document.getElementById("bTitle").textContent=d.title;
  document.getElementById("bDesc").textContent=d.desc;
}

function confCard(c,key,dayLabel){
  const el=document.createElement("article");
  el.className="conf"+(myConfs.has(key)?" faved":"");
  const dl=dayLabel?`<span class="dlabel">${dayLabel}</span>`:"";
  el.innerHTML=`<div class="when">${dl}<time>${c.t}</time><span class="room">${c.room}</span></div>
    <div><h4>${c.n}</h4><div class="spk">${c.sp}</div><p>${c.d}</p><span class="tag">${c.tag}</span></div>
    <button class="fav${myConfs.has(key)?" on":""}" data-key="${key}" aria-pressed="${myConfs.has(key)}" title="★">${myConfs.has(key)?"★":"☆"}</button>`;
  el.querySelector(".fav").addEventListener("click",e=>{
    const k=e.currentTarget.dataset.key;
    if(myConfs.has(k)) myConfs.delete(k); else myConfs.add(k);
    renderConfs();renderViewButtons();
  });
  return el;
}

function renderConfs(){
  const t=I18N[lang];
  const list=document.getElementById("confList");
  list.innerHTML="";
  if(viewMode==="day"){
    t.days[dayIdx].confs.forEach((c,j)=>{
      list.appendChild(confCard(c,`${dayIdx}-${j}`,null));
    });
  }else{
    let count=0;
    t.days.forEach((d,i)=>{
      d.confs.forEach((c,j)=>{
        const key=`${i}-${j}`;
        if(myConfs.has(key)){list.appendChild(confCard(c,key,d.date));count++;}
      });
    });
    if(count===0){
      const e=document.createElement("div");
      e.className="mine-empty";
      e.innerHTML=t.mineEmpty;
      list.appendChild(e);
    }else{
      const act=document.createElement("div");
      act.className="mine-actions";
      const btn=document.createElement("button");
      btn.className="copy-btn";
      btn.textContent=t.copyBtn;
      btn.addEventListener("click",()=>copySelection(btn));
      const note=document.createElement("span");
      note.className="mine-note";
      note.textContent=t.mineNote;
      act.appendChild(btn);act.appendChild(note);
      list.appendChild(act);
    }
  }
}

function copySelection(btn){
  const t=I18N[lang];
  const lines=[];
  I18N[lang].days.forEach((d,i)=>{
    d.confs.forEach((c,j)=>{
      if(myConfs.has(`${i}-${j}`)) lines.push(`${d.date} · ${c.t} · ${c.room} — ${c.n} (${c.sp})`);
    });
  });
  const text="EUROSATORY 2026 — "+(lang==="fr"?"MA SÉLECTION":"MY SELECTION")+"\n"+lines.join("\n");
  const done=()=>{const o=btn.textContent;btn.textContent=t.copied;setTimeout(()=>{btn.textContent=t.copyBtn;},1600);};
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(done).catch(()=>fallbackCopy(text,done));
  }else fallbackCopy(text,done);
}
function fallbackCopy(text,done){
  const ta=document.createElement("textarea");
  ta.value=text;ta.style.position="fixed";ta.style.opacity="0";
  document.body.appendChild(ta);ta.select();
  try{document.execCommand("copy");}catch(e){}
  document.body.removeChild(ta);done();
}

function renderZone(){
  const card=document.getElementById("zoneCard");
  const t=I18N[lang];
  if(!zoneId){
    card.innerHTML=`<div class="z-empty">${t.zoneEmpty}</div>`;
    return;
  }
  const z=t.zones[zoneId];
  card.innerHTML=`
    <div class="z-id">${z.id}</div>
    <h3>${z.name}</h3>
    <p>${z.desc}</p>
    ${z.items.length?`<ul class="z-list">${z.items.map(it=>`<li>${it}</li>`).join("")}</ul>`:""}`;
}

function renderPrac(){
  const list=document.getElementById("pracList");
  list.innerHTML="";
  I18N[lang].prac.forEach(p=>{
    const el=document.createElement("div");
    el.className="p-card";
    el.innerHTML=`<div class="p-ico">${p.ico}</div><div class="p-body">${p.body}</div>`;
    list.appendChild(el);
  });
}

function renderTargets(){
  const list=document.getElementById("targetList");
  list.innerHTML="";
  I18N[lang].targets.forEach(tg=>{
    const el=document.createElement("div");
    el.className="t-card";
    el.innerHTML=`<div class="t-name">${tg.n}</div><div class="t-desc">${tg.d}</div>`;
    list.appendChild(el);
  });
}

function renderAll(){renderHeader();renderTabs();renderBanner();renderConfs();renderZone();renderPrac();renderTargets();}

document.getElementById("btnFr").addEventListener("click",()=>{lang="fr";renderAll();});
document.getElementById("btnEn").addEventListener("click",()=>{lang="en";renderAll();});
document.getElementById("viewDay").addEventListener("click",()=>{viewMode="day";renderConfs();renderViewButtons();});
document.getElementById("viewMine").addEventListener("click",()=>{viewMode="mine";renderConfs();renderViewButtons();});

document.querySelectorAll("g.zone, g.poi").forEach(g=>{
  const shape=g.querySelector(".hall, .pmark, .amen");
  g.addEventListener("click",()=>{
    if(selShape) selShape.classList.remove("sel");
    selShape=shape;
    shape.classList.add("sel");
    zoneId=g.id;
    placeReticle(+g.dataset.cx, +g.dataset.cy);
    renderZone();
  });
});

function placeReticle(x,y){
  document.getElementById("retC").setAttribute("cx",x);
  document.getElementById("retC").setAttribute("cy",y);
  const l1=document.getElementById("retL1");
  l1.setAttribute("x1",x-38);l1.setAttribute("x2",x+38);l1.setAttribute("y1",y);l1.setAttribute("y2",y);
  const l2=document.getElementById("retL2");
  l2.setAttribute("x1",x);l2.setAttribute("x2",x);l2.setAttribute("y1",y-38);l2.setAttribute("y2",y+38);
  reticle.classList.add("on");
}

renderAll();
</script>
